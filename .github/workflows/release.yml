name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts only; skip GitHub Release upload
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  build:
    name: build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          # Native ARM: crate2nix/vendor cannot cross-build aarch64-linux on x86.
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
          - runner: macos-latest
            system: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(nix eval --raw ".#packages.${{ matrix.system }}.nxr.version")"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build nxr package
        run: nix build ".#packages.${{ matrix.system }}.nxr" -L --out-link result

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          system="${{ matrix.system }}"
          pkg_version="$(nix eval --raw ".#packages.${system}.nxr.version")"
          if [[ "$version" != "$pkg_version" ]]; then
            echo "tag/package version mismatch: archive=$version package=$pkg_version" >&2
            exit 1
          fi
          # Nix-package layout for inspection/reuse — not a portable standalone binary.
          staging="nxr-${version}-${system}-nix-package"
          mkdir -p "$staging"
          cp -a result/bin "$staging/"
          cp -a result/share "$staging/"
          {
            echo "nxr ${version} (${system}) — Nix package layout"
            echo
            echo "This archive is a Nix build product staged for inspection and asset"
            echo "reuse (bin/, share/man/, completions, share/nxr/shell/). The nxr"
            echo "binary links against /nix/store paths from its build-time closure."
            echo
            echo "Extracting this tarball alone does NOT produce a runnable standalone"
            echo "CLI. Prefer:"
            echo
            echo "  nix profile install github:willmortimer/nxr#packages.${system}.nxr"
            echo "  # or"
            echo "  nix build github:willmortimer/nxr#packages.${system}.nxr"
            echo "  ./result/bin/nxr --version"
            echo
            echo "See docs/RELEASE.md for the matching portable cargo binary archive"
            echo "(nxr-${version}-${system}-portable.tar.gz)."
          } > "$staging/README.txt"
          test -x "$staging/bin/nxr"
          test -d "$staging/share/man"
          test -d "$staging/share/nxr/shell"
          test -f "$staging/README.txt"
          archive="${staging}.tar.gz"
          tar -czf "$archive" "$staging"
          echo "Wrote ${archive} (Nix-package layout; not portable)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nxr-${{ matrix.system }}
          path: nxr-*.tar.gz
          if-no-files-found: error

  build-portable:
    name: build portable (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            system: aarch64-darwin
            target: aarch64-apple-darwin
          - runner: macos-latest
            system: x86_64-darwin
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"

      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          pkg_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$version" != "$pkg_version" ]]; then
            echo "tag/package version mismatch: archive=$version package=$pkg_version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build portable nxr binary
        run: cargo build -p nxr-cli --release --target "${{ matrix.target }}"

      - name: Assert no /nix/store linker dependencies
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/nxr"
          test -x "$bin"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            if ldd "$bin" | grep -q '/nix/store'; then
              echo "portable binary links to /nix/store:" >&2
              ldd "$bin" | grep '/nix/store' >&2
              exit 1
            fi
          else
            if otool -L "$bin" | grep -q '/nix/store'; then
              echo "portable binary links to /nix/store:" >&2
              otool -L "$bin" | grep '/nix/store' >&2
              exit 1
            fi
          fi

      - name: Package portable release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          system="${{ matrix.system }}"
          bin="target/${{ matrix.target }}/release/nxr"
          staging="nxr-${version}-${system}-portable"
          mkdir -p "$staging/bin"
          cp "$bin" "$staging/bin/nxr"
          {
            echo "nxr ${version} (${system}) — portable CLI binary"
            echo
            echo "This archive ships a cargo release build of the nxr CLI. The binary"
            echo "does not link against /nix/store paths and can be executed directly"
            echo "after extraction (Nix must still be on PATH for nxr to invoke flakes)."
            echo
            echo "For man pages, shell completions, and the Nix-closure layout, use"
            echo "the matching nxr-${version}-${system}-nix-package.tar.gz archive or"
            echo "install from the flake:"
            echo
            echo "  nix profile install github:willmortimer/nxr#packages.${system}.nxr"
            echo
            echo "See docs/RELEASE.md."
          } > "$staging/README.txt"
          test -x "$staging/bin/nxr"
          test -f "$staging/README.txt"
          archive="${staging}.tar.gz"
          tar -czf "$archive" "$staging"
          echo "Wrote ${archive} (portable cargo release binary)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nxr-${{ matrix.system }}-portable
          path: nxr-*-portable.tar.gz
          if-no-files-found: error

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(nix eval --raw .#packages.x86_64-linux.nxr.version)"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Generate Cargo CycloneDX SBOM
        run: |
          set -euo pipefail
          # Current cargo-cyclonedx emits one BOM per binary; publish the CLI binary SBOM.
          nix shell nixpkgs#cargo-cyclonedx nixpkgs#cargo nixpkgs#rustc --command \
            cargo cyclonedx -f json --manifest-path Cargo.toml --describe binaries
          cp crates/nxr-cli/nxr_bin.cdx.json nxr-cargo.cdx.json
          find . -name '*_bin.cdx.json' -delete

      - name: Build nxr package for Syft
        run: nix build .#packages.x86_64-linux.nxr -L --out-link result

      - name: Generate Syft SBOM
        run: |
          set -euo pipefail
          nix shell nixpkgs#syft --command \
            syft dir:result \
              --source-name nxr \
              --source-version "${{ steps.version.outputs.value }}" \
              -o cyclonedx-json=nxr-syft.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            nxr-cargo.cdx.json
            nxr-syft.cdx.json
          if-no-files-found: error

  smoke:
    name: release smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nxr-x86_64-linux
          path: artifact

      - name: Extract and smoke test release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find artifact -name '*-nix-package.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive"
          staging="$(find . -maxdepth 1 -type d -name 'nxr-*-x86_64-linux-nix-package' -print -quit)"
          test -x "$staging/bin/nxr"
          test -d "$staging/share/man"
          test -d "$staging/share/nxr/shell"
          test -f "$staging/README.txt"
          grep -q 'not a portable standalone' "$staging/README.txt"

          # Nix ELFs need their build-time /nix/store closure. Rebuilding the
          # same flake output on this runner materializes those paths; cmp
          # confirms the uploaded archive matches the reproducible package.
          # Smoke execution uses the store-backed binary — not the extracted
          # archive path — by design (see docs/RELEASE.md).
          nix build .#packages.x86_64-linux.nxr -L --out-link result
          cmp "$staging/bin/nxr" result/bin/nxr

          nxr="$(pwd)/result/bin/nxr"
          "$nxr" --version
          "$nxr" completion bash >/dev/null
          "$nxr" --flake fixtures/basic-apps hello
          "$nxr" --flake fixtures/task-dag task ci --dry-run
          "$nxr" --flake fixtures/task-dag task ci

  smoke-portable:
    name: portable smoke
    needs: build-portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nxr-x86_64-linux-portable
          path: artifact

      - name: Extract and smoke test portable archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find artifact -name '*-portable.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive"
          staging="$(find . -maxdepth 1 -type d -name 'nxr-*-x86_64-linux-portable' -print -quit)"
          bin="$staging/bin/nxr"
          test -x "$bin"
          test -f "$staging/README.txt"
          grep -q 'portable CLI binary' "$staging/README.txt"
          if ldd "$bin" | grep -q '/nix/store'; then
            echo "portable binary links to /nix/store:" >&2
            ldd "$bin" | grep '/nix/store' >&2
            exit 1
          fi
          "$bin" --version

  checksums:
    name: checksums
    needs: [build, build-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: nxr-*
          merge-multiple: true

      - name: Aggregate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -name '*.tar.gz' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: SHA256SUMS
          if-no-files-found: error

  release:
    name: github-release
    needs: [build, build-portable, sbom, checksums, smoke, smoke-portable]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.cdx.json' -o -name 'SHA256SUMS' \) \
            -exec cp {} release/ \;
          ls -1 release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body: |
            ## Artifact note

            Archives named `nxr-*-nix-package.tar.gz` are **Nix package layouts**
            (bin + share) for inspection and asset reuse. They are **not**
            portable standalone binaries: `bin/nxr` needs its `/nix/store`
            closure. Install with:

            ```bash
            nix profile install github:willmortimer/nxr#nxr
            ```

            Archives named `nxr-*-portable.tar.gz` are **portable cargo release**
            builds (`bin/nxr` only). They do not link against `/nix/store` and run
            directly after extraction (Nix must still be on `PATH`).

            See [docs/RELEASE.md](https://github.com/willmortimer/nxr/blob/main/docs/RELEASE.md).
