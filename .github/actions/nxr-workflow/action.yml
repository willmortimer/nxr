name: NXR workflow
description: >-
  Verify a signed NXR release when nxr is not already on PATH, run one
  workflow task, and write ci-run-metadata-v2. Ordinary GitHub-hosted runners
  are the target. This action does not start a runner scale set.
inputs:
  task:
    description: Workflow task name
    required: true
    default: finish
  workflow-root:
    description: Directory that contains .nxr/workflows.toml
    required: true
    default: .github/fixtures/wave3
  nxr:
    description: nxr binary. Empty uses PATH, then a Cosign-verified portable release.
    required: false
    default: ""
  version:
    description: NXR release tag used when the binary is not already on PATH
    required: false
    default: "3.8.0-rc.1"
  require-operation-id:
    description: Fail when workflow spec does not return an op_ identity
    required: false
    default: "true"
outputs:
  exit-code:
    description: Workflow process exit code
    value: ${{ steps.run.outputs.exit-code }}
  metadata:
    description: Path to ci-run-metadata.json
    value: ${{ steps.run.outputs.metadata }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        INPUT_TASK: ${{ inputs.task }}
        INPUT_WORKFLOW_ROOT: ${{ inputs.workflow-root }}
        INPUT_NXR: ${{ inputs.nxr }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REQUIRE_OPERATION_ID: ${{ inputs.require-operation-id }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
