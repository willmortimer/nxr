# Optional operation graph. Executor references only; no copied build scripts.
schema_version = 1

[tasks.prep]
platform = "unix"
executor = { native = ["nxr-fixture-echo", "prep"] }

[tasks.mid]
platform = "unix"
depends_on = ["prep"]
executor = { native = ["nxr-fixture-echo", "mid"] }

[tasks.finish]
platform = "unix"
depends_on = ["mid"]
executor = { native = ["nxr-fixture-echo", "finish"] }
